<!doctype html>
<!-- The iOS launch screen, 2732 x 2732. The launch screen fills the phone and crops the sides, so
     everything stays inside the middle 1000 or so dots. Render with art/app/README.md's command. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Yellowtail&display=swap">
<style>
  html, body { margin: 0; width: 2732px; height: 2732px; background: #000; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; }
  img { width: 560px; height: 560px; opacity: 0.95; }
  .logo { text-align: center; margin-top: -30px; }
  .neon {
    display: block;
    font: 400 150px/0.9 'Yellowtail', cursive;
    color: #ffd9d4;
    text-shadow: 0 0 14px #ff2a1e, 0 0 40px #ff2a1e, 0 0 80px #e01e1e;
    transform: rotate(-4deg);
    margin-bottom: -10px;
  }
  .word {
    display: block;
    font: 400 230px/0.9 'Anton', Impact, sans-serif;
    letter-spacing: 6px;
    color: #e4e6ea;
    text-shadow: 0 10px 0 #15161a, 0 20px 50px rgba(0, 0, 0, 0.9);
  }
</style>
</head>
<body>
  <img src="brain.svg" alt="">
  <div class="logo"><span class="neon">Cyber</span><span class="word">PSYCHOSIS</span></div>
</body>
</html>
